<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Members</title>
</head>
<body>
<a href="/member/add">Add Member</a>
<a href="/">home</a>
<table border="1">
    <tr>
        <th>Id</th>
        <th>Full Name</th>
        <th>Email</th>
        <th>Borrowed Books</th>
    </tr>
    <tr th:each="member : ${members}">
        <td th:text="${member.id}"></td>
        <td th:text="${member.fullName}"></td>
        <td th:text="${member.email}"></td>
        <td th:text="${member.borrowedBooks.size()}"></td>
    </tr>

</table>
</body>
</html>
